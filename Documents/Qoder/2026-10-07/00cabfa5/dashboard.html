<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — WebCraft Academy</title>
  <meta name="description" content="Your learning progress, achievements and recent activity.">
  <script>document.documentElement.dataset.theme = localStorage.getItem("webcraft-theme") || "light";</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='30' font-weight='bold' fill='white' text-anchor='middle'%3E%26lt;%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="navbar"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="section-eyebrow" id="dashEyebrow"></span>
        <h1>Your dashboard</h1>
        <p>Everything you have learned so far, in one place. Progress lives in this browser — no account needed.</p>
      </div>
    </section>

    <section class="container" style="padding-bottom: 84px;">
      <div class="dash-hero card" id="dashHero"></div>
      <div class="grid-4" id="statCards" style="margin-top: 24px;"></div>

      <h2 class="dash-section-title" id="coursesTitle"></h2>
      <div id="courseProgress"></div>

      <h2 class="dash-section-title" id="achTitle"></h2>
      <div class="ach-grid" id="achGrid"></div>

      <h2 class="dash-section-title" id="activityTitle"></h2>
      <div class="card" style="padding: 10px 22px;" id="activityCard"></div>

      <div class="reset-zone" id="resetZone"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
